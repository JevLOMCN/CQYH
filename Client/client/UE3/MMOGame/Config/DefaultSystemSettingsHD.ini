[Configuration]
BasedOn=..\Engine\Config\BaseSystemSettings.ini

[SystemSettings]
AutoPerformanceCheckTimeNew=30
;oscar
RenderHDR=false
UseDOFLuminanceClamp=false
AutoAdjustPerformance=true
MaxShowPlayerCount=100
;oscar
;zhaojun
OneFrameThreadLag=true
;zhaojun

ShadowDepthBias=0.011

; NVCHANGE_BEGIN: Add Particle Downsampling & Blur
NVParticleDownsampling=True
NVParticleDownsamplingThreshold=100.0
NVParticleBlur=True
NVParticleBlurMaxRadiusScale=8.0
; NVCHANGE_END: Add Particle Downsampling & Blur
; NVCHANGE_BEGIN: Add Opacity Shadows
NVOpacityShadows=false
NVOpaqueOpacityShadows=false
NVOpacityShadowResolution=128
; NVCHANGE_END: Add Opacity Shadows

ApexClothingAllowApexWorkBetweenSubsteps=False
; NVCHANGE_BEGIN: DMS - APEX 1.2 Expose the ability to run apex clothing rendering tasks without blocking fetch results
ApexClothingAsyncFetchResults=False
; NVCHANGE_END: DMS - APEX 1.2 Expose the ability to run apex clothing rendering tasks without blocking fetch results


DrawSilhouettes=true
EditorMaxDrawDistanceScale=3.0
MaxDrawDistanceScale=3

CSMSplitNum=0

;ming
NumMipsToDrop=0

; always allow AA
AllowPostProcessAA=true
bAllowPostprocessMLAA=true

TEXTUREGROUP_ColorLookupTable=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=Aniso,MipFilter=Point,MipGenSettings=TMGS_SimpleAverage)

;texture
TEXTUREGROUP_World=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_WorldNormalMap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_WorldSpecular=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)

TEXTUREGROUP_Character=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_CharacterNormalMap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_CharacterSpecular=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)

TEXTUREGROUP_Weapon=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_WeaponNormalMap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_WeaponSpecular=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)

TEXTUREGROUP_Effects=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=linear)

TEXTUREGROUP_Skybox=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_UI=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_Lightmap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_Shadowmap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,NumStreamedMips=3)
TEXTUREGROUP_RenderTarget=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_ProcBuilding_Face=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_ProcBuilding_LightMap=(MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_Terrain_Heightmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso)
TEXTUREGROUP_Terrain_Weightmap=(MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso)
; fractured
NumFracturedPartsScale			= 2.0
FractureDirectSpawnChanceScale	= 2.0
FractureRadialSpawnChanceScale	= 2.0
FractureCullDistanceScale		= 1.5


;anis
MaxAnisotropy=32
MaxMultiSamples=1

SoundLevel=1
MaxParticleSpriteCount=131972
MaxParticleSubUVCount=131972
StaticMeshLODBias=2
SkeletalMeshLODBias=1
ParticleLODBias=2
ShowFoliageInstance=1

;-----------------------------------------------------------
;combined settings
[CombinedSettingMap]
AllowDecal=StaticDecals
+AllowDecal=DynamicDecals

AllowShadow=DynamicShadows
+ShadowQuality=bUseShadowmaps
+AllowShadow=LightEnvironmentShadows
+AllowShadow=bAllowWholeSceneDominantShadows

ShadowQuality=MinShadowResolution
+ShadowQuality=MinPreShadowResolution
+ShadowQuality=MaxShadowResolution
+ShadowQuality=MaxWholeSceneDominantShadowResolution
+ShadowQuality=ShadowTexelsPerPixel
+ShadowQuality=ShadowFilterQualityBias

;-----------------------------------------------------------
;decal settings
[AllowDecal_0]
StaticDecals=false
DynamicDecals=false

[AllowDecal_1]
StaticDecals=true
DynamicDecals=true

;-----------------------------------------------------------
;shadow settings
[AllowShadow_0]
DynamicShadows=false
bUseShadowmaps=false
LightEnvironmentShadows=true
bAllowWholeSceneDominantShadows=true

[AllowShadow_1]
DynamicShadows=true
bUseShadowmaps=false
LightEnvironmentShadows=true
bAllowWholeSceneDominantShadows=true

;-----------------------------------------------------------
[ShadowQuality_1]
MinShadowResolution=32
MinPreShadowResolution=32
MaxShadowResolution=512
MaxWholeSceneDominantShadowResolution=512
ShadowTexelsPerPixel=1.5
ShadowFilterQualityBias=0

[ShadowQuality_2]
MinShadowResolution=32
MinPreShadowResolution=32
MaxShadowResolution=1024
MaxWholeSceneDominantShadowResolution=1024
ShadowTexelsPerPixel=2.0
ShadowFilterQualityBias=0

[ShadowQuality_3]
MinShadowResolution=32
MinPreShadowResolution=32
MaxShadowResolution=2048
MaxWholeSceneDominantShadowResolution=2048
ShadowTexelsPerPixel=2.5
ShadowFilterQualityBias=1

